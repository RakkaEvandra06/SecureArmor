<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <!-- Background Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
        </pattern>

        <!-- Fortress Build-Up Animation -->
        <clipPath id="buildUp">
            <rect x="300" y="120" width="200" height="0">
                <animate attributeName="height" from="0" to="70" dur="2s" fill="freeze" />
            </rect>
        </clipPath>

        <!-- Main Headline Drop-Down Animation -->
        <clipPath id="headClip">
            <rect x="100" y="140" width="600" height="0">
                <animate attributeName="height" from="0" to="70" dur="2s" fill="freeze" />
            </rect>
        </clipPath>

        <!-- Prompt Typewriter Animation -->
        <clipPath id="promptClip">
            <rect x="70" y="85" width="0" height="25">
                <animate attributeName="width" from="0" to="260" dur="2s" fill="freeze" />
            </rect>
        </clipPath>

        <!-- Subheadline Typewriter Animation -->
        <clipPath id="subClip">
            <rect x="60" y="260" width="0" height="30">
                <animate attributeName="width" from="0" to="680" dur="4s" fill="freeze" />
            </rect>
        </clipPath>
    </defs>

    <!-- Background Layer -->
    <rect width="800" height="400" fill="#0d1117" />
    <rect width="800" height="400" fill="url(#grid)" />

    <!-- Matrix Rain Background Effect (Password Analysis Data) -->
    <g fill="#30363d" font-family="monospace" font-size="14" opacity="0.6">
        <text x="80" y="0">
            <tspan>0</tspan><tspan>1</tspan><tspan>1</tspan><tspan>0</tspan><tspan>#</tspan><tspan>!</tspan><tspan>1</tspan><tspan>0</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="6s" repeatCount="indefinite" begin="0s" />
        </text>
        <text x="220" y="0">
            <tspan>$</tspan><tspan>%</tspan><tspan>^</tspan><tspan>&amp;</tspan><tspan>*</tspan><tspan>0</tspan><tspan>!</tspan><tspan>#</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="7s" repeatCount="indefinite" begin="2s" />
        </text>
        <text x="360" y="0">
            <tspan>a</tspan><tspan>b</tspan><tspan>c</tspan><tspan>1</tspan><tspan>2</tspan><tspan>3</tspan><tspan>$</tspan><tspan>@</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="5s" repeatCount="indefinite" begin="1s" />
        </text>
        <text x="500" y="0">
            <tspan>Z</tspan><tspan>Y</tspan><tspan>X</tspan><tspan>9</tspan><tspan>8</tspan><tspan>7</tspan><tspan>%</tspan><tspan>^</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="8s" repeatCount="indefinite" begin="3s" />
        </text>
        <text x="640" y="0">
            <tspan>@</tspan><tspan>#</tspan><tspan>$</tspan><tspan>%</tspan><tspan>^</tspan><tspan>&amp;</tspan><tspan>*</tspan><tspan>0</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="4s" repeatCount="indefinite" begin="0.5s" />
        </text>
        <text x="780" y="0">
            <tspan>P</tspan><tspan>a</tspan><tspan>$</tspan><tspan>$</tspan><tspan>w</tspan><tspan>0</tspan><tspan>1</tspan><tspan>!</tspan>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="0 400" dur="6s" repeatCount="indefinite" begin="2.5s" />
        </text>
    </g>

    <!-- Terminal Window Frame -->
    <rect x="30" y="20" width="740" height="360" fill="none" stroke="#30363d" stroke-width="2" rx="8" />
    <rect x="30" y="20" width="740" height="30" fill="#30363d" rx="8" />
    <rect x="30" y="42" width="740" height="10" fill="#30363d" />
    
    <!-- Terminal Title Bar -->
    <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e" font-weight="bold">passfortress@cli ~ bash</text>
    
    <!-- Terminal Traffic Lights (Grayscale) -->
    <circle cx="50" cy="35" r="6" fill="#484f58" />
    <circle cx="70" cy="35" r="6" fill="#484f58" />
    <circle cx="90" cy="35" r="6" fill="#484f58" />

    <!-- CLI Prompt Line -->
    <text x="70" y="100" font-family="'Courier New', monospace" font-size="16" fill="#8b949e" clip-path="url(#promptClip)">
        $ sudo launch PassFortress
    </text>
    <text x="320" y="100" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">
        _
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" begin="2s" />
    </text>

    <!-- Separator 1 -->
    <line x1="70" y1="130" x2="730" y2="130" stroke="#30363d" stroke-width="2" stroke-dasharray="10 4">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </line>

    <!-- Fortress Icon Group -->
    <g clip-path="url(#buildUp)">
        <!-- Animated Brackets around Fortress -->
        <text x="310" y="100" font-family="'Courier New', monospace" font-size="40" fill="#f0f6fc">
            [
            <animateTransform attributeName="transform" type="translate" from="-50 0" to="0 0" dur="1s" fill="freeze" />
        </text>
        <text x="480" y="100" font-family="'Courier New', monospace" font-size="40" fill="#f0f6fc">
            ]
            <animateTransform attributeName="transform" type="translate" from="50 0" to="0 0" dur="1s" fill="freeze" />
        </text>

        <!-- Fortress Left Tower -->
        <rect x="340" y="80" width="40" height="30" fill="#f0f6fc" stroke="#0d1117" stroke-width="2" />
        <!-- Fortress Right Tower -->
        <rect x="420" y="80" width="40" height="30" fill="#f0f6fc" stroke="#0d1117" stroke-width="2" />
        <!-- Fortress Center Keep -->
        <rect x="380" y="70" width="40" height="40" fill="#f0f6fc" stroke="#0d1117" stroke-width="2" />
        <!-- Fortress Base Wall -->
        <rect x="330" y="110" width="140" height="10" fill="#f0f6fc" stroke="#0d1117" stroke-width="2" />
        
        <!-- Battlements (Left Tower) -->
        <rect x="340" y="75" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <rect x="354" y="75" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <!-- Battlements (Right Tower) -->
        <rect x="420" y="75" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <rect x="434" y="75" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <!-- Battlements (Center Keep) -->
        <rect x="380" y="65" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <rect x="394" y="65" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />
        <rect x="408" y="65" width="8" height="5" fill="#f0f6fc" stroke="#0d1117" stroke-width="1" />

        <!-- Fortress Door -->
        <rect x="390" y="90" width="20" height="20" fill="#0d1117" />
        <line x1="400" y1="90" x2="400" y2="110" stroke="#0d1117" stroke-width="2" />
        
        <!-- Animated Fortress Flag -->
        <line x1="400" y1="30" x2="400" y2="70" stroke="#f0f6fc" stroke-width="4" />
        <path fill="#f0f6fc">
            <animate attributeName="d" values="M 400 40 L 430 45 L 400 50 Z;M 400 40 L 435 48 L 400 52 Z;M 400 40 L 430 45 L 400 50 Z" dur="1s" repeatCount="indefinite" />
        </path>
    </g>

    <!-- Scanning Line Effect over the Fortress -->
    <rect x="280" y="110" width="240" height="2" fill="#f0f6fc" opacity="0.4">
        <animate attributeName="y" from="110" to="160" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Main Headline -->
    <text x="400" y="200" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="64" font-weight="bold" fill="#f0f6fc" letter-spacing="4" clip-path="url(#headClip)">
        PassFortress
    </text>

    <!-- Headline Glitch/Scanning Highlight Effect -->
    <rect x="120" y="140" width="560" height="70" fill="none" stroke="#f0f6fc" stroke-width="1" opacity="0.2">
        <animate attributeName="y" values="140; 210; 140" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Subheadline Section -->
    <clipPath id="subClip">
        <rect x="60" y="260" width="0" height="30">
            <animate attributeName="width" from="0" to="680" dur="4s" fill="freeze" />
        </rect>
    </clipPath>

    <!-- Separator 2 -->
    <line x1="70" y1="240" x2="730" y2="240" stroke="#30363d" stroke-width="2" stroke-dasharray="10 4">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </line>

    <!-- Typewriter Subheadline -->
    <text x="400" y="280" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#8b949e" clip-path="url(#subClip)">
        a hardened CLI toolkit for analyzing password strength
    </text>

    <!-- Blinking Cursor after Subheadline -->
    <text x="660" y="280" font-family="'Courier New', monospace" font-size="18" fill="#8b949e">
        _
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="4s" />
    </text>

    <!-- Bottom Defense Line Animation -->
    <line x1="0" y1="370" x2="800" y2="370" stroke="#30363d" stroke-width="1" stroke-dasharray="10 5">
        <animate attributeName="stroke-dashoffset" from="0" to="30" dur="1s" repeatCount="indefinite" />
    </line>
</svg>